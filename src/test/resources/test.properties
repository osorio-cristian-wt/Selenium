# ============================================================================
#  Configuración de los tests E2E  (un solo lugar para todos los tests)
#  Se puede pisar sin tocar este archivo:
#     mvn test -Dbrowser=edge          o   variable de entorno BROWSER=edge
# ============================================================================

# Navegador para TODOS los tests: auto | chrome | edge | firefox
#   auto = usa el primero que esté instalado en la PC: Chrome -> Edge -> Firefox
#          (si no encuentra ninguno, Selenium Manager descarga Chrome automáticamente)
browser=auto

# true = sin ventana (servidores, CI). false = se ve el navegador.
headless=false

# URL del front a probar
base.url=http://localhost:3001

# Segundos máximos de espera por cada elemento
timeout.seconds=10

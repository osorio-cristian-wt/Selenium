name: Tests E2E (Selenium)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL del frontend a probar (vista desde el contenedor del navegador)"
        required: false
        default: "http://host.docker.internal:3001"

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Levantar navegador remoto
        run: docker compose up -d --wait browser

      - name: Correr tests E2E
        run: docker compose run --rm e2e

      - name: Publicar reporte HTML (ExtentReports) y surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-e2e
          path: |
            reportes/
            target/surefire-reports/
          if-no-files-found: warn

      - name: Bajar contenedores
        if: always()
        run: docker compose down

name: Tests E2E (Selenium)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar front + navegador y correr los tests E2E
        run: docker compose run --rm e2e

      - name: Publicar reporte HTML (ExtentReports) y surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-e2e
          path: |
            reportes/
            target/surefire-reports/
          if-no-files-found: warn

      - name: Logs del front si falló
        if: failure()
        run: docker compose logs frontend

      - name: Bajar contenedores
        if: always()
        run: docker compose down
